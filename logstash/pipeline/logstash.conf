# =============================================================================
# Logstash Pipeline Configuration - Traitement des logs Titanic Dashboard
# =============================================================================
# Ce pipeline :
# 1. Recoit les logs JSON depuis Filebeat (port 5044)
# 2. Parse les champs JSON
# 3. Index dans Elasticsearch avec le pattern titanic-logs-YYYY.MM.dd
# =============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Le message est deja en JSON grace a la config Filebeat
  # Extraction des champs supplementaires si necessaire

  # Ajout du type de log
  if [page] {
    mutate {
      add_field => { "log_type" => "dashboard_interaction" }
    }
  }

  # Extraction de l'heure pour les agregations temporelles
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Nettoyage des champs inutiles
  mutate {
    remove_field => ["agent", "ecs", "host", "log", "input", "[host][os]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "titanic-logs-%{+YYYY.MM.dd}"
  }

  # Sortie console pour le debug
  stdout {
    codec => rubydebug
  }
}
