# =============================================================================
# GitHub Actions - Pipeline CI/CD Titanic Dashboard
# =============================================================================
# Pipeline complet avec 4 jobs :
#   Job 1 - Lint & Test : Analyse flake8 + tests unitaires pytest
#   Job 2 - Rapport     : Generation rapport HTML (ydata-profiling) + upload Nexus
#   Job 3 - Docker      : Build image + push vers DockerHub
#   Job 4 - Deploy      : Deploiement avec docker-compose
# =============================================================================

name: Titanic Dashboard CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: titanic-dashboard
  DOCKER_TAG: ${{ github.sha }}
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # JOB 1 : Lint & Test
  # ===========================================================================
  lint-and-test:
    name: "Job 1 - Lint & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint avec flake8
        run: |
          # Analyse statique du code Python
          # Erreurs bloquantes (E9,F63,F7,F82) + complexite max 10
          flake8 app.py data/loader.py tests/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --max-complexity=10 \
            --max-line-length=100
          echo "flake8 : Aucune erreur bloquante detectee"

      - name: Tests unitaires pytest
        run: |
          pytest tests/ -v --tb=short --cov=data --cov-report=term-missing
        env:
          PYTHONPATH: .

      - name: Upload des resultats de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ===========================================================================
  # JOB 2 : Generation du rapport HTML (ydata-profiling) + Nexus
  # ===========================================================================
  generate-report:
    name: "Job 2 - Rapport HTML + Nexus"
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generation du rapport ydata-profiling
        run: |
          python -c "
          from data.loader import load_titanic_data
          from ydata_profiling import ProfileReport

          df = load_titanic_data()
          profile = ProfileReport(
              df,
              title='Titanic Dataset - Rapport d\\'Analyse',
              minimal=True,
              explorative=True
          )
          profile.to_file('report.html')
          print('Rapport genere avec succes : report.html')
          "

      - name: Upload du rapport comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: titanic-report-v1.0.html
          path: report.html
          retention-days: 30

      - name: Publication sur Nexus (simulation)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "============================================"
          echo "Publication du rapport sur Nexus"
          echo "============================================"
          echo "Fichier : report.html"
          echo "Version : v1.0"
          echo "Commit  : ${{ github.sha }}"
          echo ""
          echo "Dans un environnement de production, utiliser :"
          echo "  curl -u user:pass --upload-file report.html \\"
          echo "    https://nexus.example.com/repository/reports/titanic-report-v1.0.html"
          echo ""
          echo "Le rapport est disponible comme artefact GitHub Actions."

  # ===========================================================================
  # JOB 3 : Docker Build & Push vers DockerHub
  # ===========================================================================
  docker-build-push:
    name: "Job 3 - Docker Build & Push"
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraction des metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            latest

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de l'image Docker locale
        run: |
          docker run -d --name titanic-test -p 8501:8501 ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          sleep 10
          curl -f http://localhost:8501/_stcore/health || (docker logs titanic-test && exit 1)
          docker stop titanic-test
          docker rm titanic-test
          echo "Test de l'image Docker reussi"

      - name: Push de l'image sur DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 4 : Deploy avec docker-compose
  # ===========================================================================
  deploy:
    name: "Job 4 - Deploy"
    runs-on: ubuntu-latest
    needs: [docker-build-push, generate-report]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Telechargement du rapport depuis les artefacts
        uses: actions/download-artifact@v4
        with:
          name: titanic-report-v1.0.html
          path: .

      - name: Deploiement avec docker-compose
        run: |
          echo "============================================"
          echo "Deploiement du Titanic Dashboard"
          echo "============================================"

          # Pull de l'image depuis DockerHub
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest || true

          # Lancement de la stack complete (app + ELK)
          docker compose up -d

          echo "Attente du demarrage des services..."
          sleep 30

          # Verification de l'application
          curl -f http://localhost:8501/_stcore/health || echo "Attention : app non encore prete"

          echo "============================================"
          echo "Services deployes avec succes :"
          docker compose ps
          echo "============================================"
          echo ""
          echo "- Dashboard Streamlit : http://localhost:8501"
          echo "- Kibana               : http://localhost:5601"
          echo "- Elasticsearch        : http://localhost:9200"

      - name: Verification du deploiement
        run: |
          echo "Verification des services..."
          docker compose ps
          echo ""
          echo "Check sante application..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8501/_stcore/health || echo "En attente..."

      - name: Nettoyage en cas d'echec
        if: failure()
        run: |
          docker compose logs --tail=50
          docker compose down -v
